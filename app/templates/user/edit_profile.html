{% extends "base.html" %}

{% block title %}编辑个人信息 - Supernono AI聊天机器人{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-user-edit me-2"></i>编辑个人信息
                </h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('user.edit_profile') }}">
                    <div class="text-center mb-4">
                        <img src="{{ url_for('static', filename=user.get_avatar_path()) }}" alt="头像" class="avatar" style="width: 80px; height: 80px; object-fit: cover;">
                    </div>
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="fas fa-user me-2"></i>用户名
                        </label>
                        <input type="text" class="form-control" id="username" name="username" 
                               value="{{ user.username }}" required placeholder="请输入用户名">
                    </div>

                    <hr class="my-4">
                    <h6 class="mb-3">
                        <i class="fas fa-lock me-2"></i>修改密码
                        <small class="text-muted">（可选）</small>
                    </h6>

                    <div class="mb-3">
                        <label for="current_password" class="form-label">当前密码</label>
                        <input type="password" class="form-control" id="current_password" name="current_password" 
                               placeholder="如需修改密码，请输入当前密码">
                    </div>

                    <div class="mb-3">
                        <label for="new_password" class="form-label">新密码</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" 
                               placeholder="请输入新密码">
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">确认新密码</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                               placeholder="请再次输入新密码">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('user.profile') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-1"></i>返回
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>保存更改
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- 温馨提示 -->
        <div class="card mt-3">
            <div class="card-body">
                <h6 class="text-warning">
                    <i class="fas fa-exclamation-triangle me-2"></i>温馨提示
                </h6>
                <ul class="mb-0 small text-muted">
                    <li>用户名修改后，您需要使用新的用户名登录</li>
                    <li>如果不需要修改密码，请将密码相关字段留空</li>
                    <li>修改密码需要先输入当前密码进行验证</li>
                    <li>新密码建议包含字母、数字，长度不少于6位</li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    // 密码确认验证
    $('#confirm_password').on('input', function() {
        var newPassword = $('#new_password').val();
        var confirmPassword = $(this).val();
        
        if (newPassword && confirmPassword) {
            if (newPassword === confirmPassword) {
                $(this).removeClass('is-invalid').addClass('is-valid');
            } else {
                $(this).removeClass('is-valid').addClass('is-invalid');
            }
        } else {
            $(this).removeClass('is-valid is-invalid');
        }
    });
});
</script>
{% endblock %}

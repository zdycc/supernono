{% extends "base.html" %}

{% block title %}添加管理员 - Supernono AI聊天机器人{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-user-shield me-2"></i>添加新管理员
                </h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin.add_admin') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="fas fa-user me-2"></i>管理员用户名
                        </label>
                        <input type="text" class="form-control" id="username" name="username" required 
                               placeholder="请输入管理员用户名">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock me-2"></i>密码
                        </label>
                        <input type="password" class="form-control" id="password" name="password" required 
                               placeholder="请输入管理员密码">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.manage_admins') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-1"></i>返回
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>创建管理员
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- 权限说明 -->
        <div class="card mt-3">
            <div class="card-header">
                <h6 class="mb-0">
                    <i class="fas fa-info-circle me-2"></i>管理员权限
                </h6>
            </div>
            <div class="card-body">
                <ul class="mb-0">
                    <li>用户管理：创建、编辑、删除普通用户</li>
                    <li>聊天室管理：创建、编辑、删除聊天室</li>
                    <li>权限分配：管理用户在聊天室中的权限</li>
                    <li>数据导出：导出聊天记录和系统数据</li>
                    <li>系统监控：查看系统统计和状态</li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}

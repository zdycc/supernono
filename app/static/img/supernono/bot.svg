<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- 背景圆 -->
  <circle cx="50" cy="50" r="45" fill="#667eea" stroke="#764ba2" stroke-width="3"/>
  
  <!-- 机器人头部 -->
  <rect x="30" y="25" width="40" height="35" rx="8" fill="#ffffff"/>
  
  <!-- 眼睛 -->
  <circle cx="40" cy="37" r="4" fill="#667eea"/>
  <circle cx="60" cy="37" r="4" fill="#667eea"/>
  <circle cx="40" cy="37" r="2" fill="#ffffff"/>
  <circle cx="60" cy="37" r="2" fill="#ffffff"/>
  
  <!-- 嘴巴 -->
  <path d="M 35 47 Q 50 55 65 47" stroke="#667eea" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- 天线 -->
  <line x1="45" y1="25" x2="45" y2="15" stroke="#764ba2" stroke-width="2"/>
  <line x1="55" y1="25" x2="55" y2="15" stroke="#764ba2" stroke-width="2"/>
  <circle cx="45" cy="15" r="2" fill="#764ba2"/>
  <circle cx="55" cy="15" r="2" fill="#764ba2"/>
  
  <!-- 身体 -->
  <rect x="35" y="60" width="30" height="25" rx="5" fill="#ffffff"/>
  
  <!-- 胸前指示灯 -->
  <circle cx="50" cy="70" r="3" fill="#28a745"/>
  
  <!-- 文字 -->
  <text x="50" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" font-weight="bold">supernono</text>
</svg> 